[project]
name = "vistaiq"
version = "0.1.0"
description = "VistaIQ monitoring, security, and DevOps observability platform."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Without this, pytest-asyncio creates a fresh event loop per test while
# module-level async primitives (the JWKS cache locks) stay bound to another,
# producing "attached to a different loop" errors that look like flakiness.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    # Calling a function in a default argument is how FastAPI declares
    # dependencies (`user = Depends(get_current_user)`). Flagging it would
    # mean flagging every route in the codebase.
    "B008",
]
